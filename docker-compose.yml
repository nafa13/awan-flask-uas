version: '3.8'

services:
  # 1. FRONTEND TIER (Hanya berjalan di Server Frontend EC2)
  frontend:
    build: ./nginx
    image: farmassist_frontend_image:latest
    container_name: farmassist_frontend
    ports:
      - "80:80"
    networks:
      - public_net

  # 2. BACKEND/APP TIER (Hanya berjalan di Server Backend Privat EC2)
  backend:
    image: farmassist_backend_image:latest
    container_name: farmassist_backend
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=super-secret-key-for-farmassist
      - DATABASE_URL=mysql+pymysql://root:rootpassword@db:3306/farmassist_db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - R2_ENDPOINT=${R2_ENDPOINT}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME}
      - R2_PUBLIC_URL=${R2_PUBLIC_URL}
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - public_net
      - private_net

  # 3. DATABASE TIER (Hanya berjalan di Server Backend Privat EC2)
  db:
    image: mysql:8.0
    container_name: farmassist_db
    # 🟢 JURUS JINAK: Matikan performance schema & batasi pool memori agar MySQL ringan dan lolos timeout!
    command: --performance-schema=OFF --innodb-buffer-pool-size=128M --innodb-log-buffer-size=8M
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=farmassist_db
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - private_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  public_net:
    driver: bridge
  private_net:
    driver: bridge
    internal: true 

volumes:
  db_data: