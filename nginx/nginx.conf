server {
    listen 80;

    # Konfigurasi reverse proxy ke backend Flask
    location / {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Anda bisa memisahkan handling static file di NGINX jika diinginkan
    # Namun karena di Flask static files berada dalam app, kita proxy semuanya
}
