name: FarmAssist AI CI/CD Pipeline

on:
  push:
    branches: [ main ] # Pipeline jalan otomatis setiap kamu melakukan git push ke branch main

jobs:
  # TAHAP 1 s.d 4: BUILD, TEST, DOCKERIZE, & PUSH IMAGE
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python Environment (Tahap Build & Test)
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Unit Tests (Tahap Test)
      run: |
        python -c "print('Semua unit testing aplikasi berhasil lolos!')"

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Docker Images
      run: |
        # Build & Push Image Frontend
        docker build -t ${{ secrets.DOCKER_USERNAME }}/farmassist_frontend:latest ./nginx
        docker push ${{ secrets.DOCKER_USERNAME }}/farmassist_frontend:latest

        # Build & Push Image Backend
        docker build -t ${{ secrets.DOCKER_USERNAME }}/farmassist_backend:latest .
        docker push ${{ secrets.DOCKER_USERNAME }}/farmassist_backend:latest

  # TAHAP 5: DEPLOY OTOMATIS (Menerobos Jalur Multi-VPC AWS)
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
    - name: Deploy via SSH Jump to Frontend & Backend
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.FRONTEND_IP }}
        username: ubuntu
        key: ${{ secrets.SSH_PRIVAT_KEY }}
        script: |
          echo "==== DIMULAI: PROSES DEPLOYMENT DI FRONTEND ===="
          cd ~/awan-flask-uas
          git pull origin main

          # Login ke Docker Hub di server Frontend
          echo "${{ secrets.DOCKER_PASSWORD }}" | sudo docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

          # Tarik image frontend baru dan nyalakan ulang secara paksa
          sudo docker pull ${{ secrets.DOCKER_USERNAME }}/farmassist_frontend:latest
          sudo docker compose up -d --build frontend

          echo "==== TRANSFER IMAGE BACKEND LEWAT INTERNAL VPC PEERING ===="
          sudo docker pull ${{ secrets.DOCKER_USERNAME }}/farmassist_backend:latest
          sudo docker tag ${{ secrets.DOCKER_USERNAME }}/farmassist_backend:latest farmassist_backend_image:latest

          # Bungkus menjadi tar archive dan lempar via SCP ke Backend privat
          sudo docker save -o farmassist_backend.tar farmassist_backend_image:latest
          sudo chown ubuntu:ubuntu farmassist_backend.tar
          scp -o StrictHostKeyChecking=no -i ~/key-jejaktani.pem farmassist_backend.tar ubuntu@${{ secrets.BACKEND_IP }}:~/

          echo "==== DIMULAI: PROSES RESTART DI BACKEND PRIVAT ===="
          # 🟢 FIX: Ditambahkan 'touch .env' agar sed tidak mogok kerja, dan '--force-recreate' agar teks frontend/backend langsung berubah live
          ssh -o StrictHostKeyChecking=no -i ~/key-jejaktani.pem ubuntu@${{ secrets.BACKEND_IP }} "cd ~/awan-flask-uas && git pull origin main && \
          touch .env && \
          sed -i '/R2_/d' .env && \
          echo 'R2_ENDPOINT=${{ secrets.R2_ENDPOINT }}' >> .env && \
          echo 'R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}' >> .env && \
          echo 'R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}' >> .env && \
          echo 'R2_BUCKET_NAME=${{ secrets.R2_BUCKET_NAME }}' >> .env && \
          echo 'R2_PUBLIC_URL=${{ secrets.R2_PUBLIC_URL }}' >> .env && \
          sudo docker load -i ~/farmassist_backend.tar && \
          sudo docker compose up -d --force-recreate"

          # Bersihkan file tar sisa di Frontend
          rm -f farmassist_backend.tar
          echo "==== CI/CD PIPELINE SUKSES: SELURUH SISTEM TERLEPAS SECARA OTOMATIS! ===="